name: 错误报告
description: 报告 PhantomLoaderQQNT 的安装、启动或插件 API 问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。请注明完整的 QQNT 版本和 PhantomLoaderQQNT 版本，并删除日志中的账号、聊天内容和其他个人信息。
        当前发行版支持 Windows 11 x64 / QQNT 9.9.37-54395。请通过 QQNT (PhantomLoader) 快捷方式启动。
  - type: input
    id: phantomloader-version
    attributes:
      label: PhantomLoaderQQNT 版本或 Commit
    validations:
      required: true
  - type: input
    id: qqnt-version
    attributes:
      label: QQNT 完整版本
      placeholder: 9.9.37-54395
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows 版本与架构
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 重现步骤
      description: 请列出已启用的插件，并说明问题是否也在禁用第三方插件时出现。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与安装器错误信息
  - type: textarea
    id: extra
    attributes:
      label: 补充说明
