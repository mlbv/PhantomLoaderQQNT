name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: mlbv/PhantomLoaderQQNT/.github/workflows/publish-release.yml@main
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
