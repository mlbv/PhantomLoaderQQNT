[workspace]
members = ["crates/platform", "crates/launcher", "crates/payload", "crates/neohook-embed"]
exclude = ["build/dependencies/neohook", "build/dependencies/iced-x86", "tests/rust-host", "tests/rust-fixtures"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
rust-version = "1.99"

[workspace.dependencies]
platform = { package = "phantomloader-platform", path = "crates/platform" }
neohook = { package = "neohook-embed", path = "crates/neohook-embed" }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Environment",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.dev]
panic = "abort"
